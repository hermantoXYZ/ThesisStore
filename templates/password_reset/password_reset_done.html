{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Terkirim - {{ web_name }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v={{ STATIC_VERSION }}">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32x32.png' %}">
</head>

<body class="login-page">

    <div class="login-container">
        <div class="login-card" style="text-align: center;">

            <!-- Icon Box -->
            <div style="width: 64px; height: 64px; background: #eff6ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; color: #2563eb; font-size: 32px;">
                <i class="ri-mail-check-line"></i>
            </div>

            <div class="login-header">
                <h2 style="font-size: 20px; font-weight: 700; color: #1e293b; margin: 0 0 8px 0;">Periksa Email Anda</h2>
                <p class="login-subtitle" style="margin: 0; font-size: 13.5px; color: #64748b; line-height: 1.6;">
                    Kami telah mengirimkan instruksi dan tautan untuk mengatur ulang password ke alamat email Anda. Silakan periksa folder <strong>Kotak Masuk (Inbox)</strong> atau <strong>Spam</strong>.
                </p>
            </div>

            <div style="margin-top: 24px;">
                <a href="{% url 'login' %}" class="login-btn" style="display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%;">
                    <span>Kembali ke Halaman Login</span>
                    <i class="ri-arrow-right-line"></i>
                </a>
            </div>

            <div class="login-footer" style="margin-top: 28px;">
                <p>&copy; 2026 {{ web_name }}.</p>
            </div>

        </div>
    </div>

</body>
</html>
